id = "kiro"
version = "2026.10.05.1"
min_engine_version = 2
updated_at = "2026-10-05T00:00:00Z"
aliases = ["kiro-cli"]

[[rules]]
id = "live_prompt_idle"
state = "idle"
priority = 1100
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['(?i)^\s*[>›]\s*ask a question or describe a task(?:\s+(?:enter|↵))?\s*$']

[[rules]]
id = "tool_approval"
state = "blocked"
priority = 1050
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { all = [
    { line_regex = ['(?i)^\s*esc\s+to\s+(?:close|cancel)\b'] },
    { any = [
      { line_regex = ['(?i)^\s*[>❯›]?\s*(?:allow|always allow|deny|always deny)\s*$'] },
      { line_regex = ['(?i)^\s*[>❯›]?\s*(?:yes, single permission|trust, always allow in this session|no \(tab to edit\))\s*$'] },
      { line_regex = ['(?i)^\s*[>❯›]?\s*(?:trust\b.*|entire tool)\b'] },
    ] },
  ] },
  { line_regex = ['(?i)\[y\/n\]|\(y\/n\)|\(allow\/deny\)'] },
  { line_regex = ['(?i)(?:allow|approve|execute|run|proceed).*\b(?:\[y\/n\]|\(y\/n\)|\(yes\/no\)|y\/n|yes\/no)'] },
  { contains = ["tool approval", "requires approval"] },
]

[[rules]]
id = "tool_approval_edit"
state = "blocked"
priority = 1045
region = "whole_recent"
visible_blocker = true
regex = ['(?im)(?:^|\n)[ \t]*[-─]+[ \t]*\n[^\n]*requires\s+approval\s*[·.]\s*modify\s+request[ \t]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*?[ \t]*[>›][ \t]*[^\n]*\n(?:[ \t]*\n|[^\n]*[^\s─-][^\n]*\n)*[ \t]*[-─]+[ \t]*\n[ \t]*esc[ \t]+to[ \t]+close[ \t]*\n?\z']

[[rules]]
id = "crew_approval"
state = "blocked"
priority = 1040
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "tool approval",
  "approve all pending",
  "configure individually (agent monitor)",
  "exit (cancel subagents)",
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 1030
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["to navigate", "to submit", "esc to cancel"]

[[rules]]
id = "live_working_footer"
state = "working"
priority = 950
region = "bottom_non_empty_lines(4)"
visible_working = true
contains = ["kiro is working", "type to steer", "ctrl+s to queue"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?i)^[◐◓◑◒/|\\-]\s+kiro:']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 890
region = "osc_progress"
visible_working = true
regex = ['^4;3;?$']
